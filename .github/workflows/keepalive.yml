# Keeps the portal's database from being paused for inactivity (Supabase free plan pauses
# projects that see no activity for about 7 days). Every 3 days this calls a tiny database
# function that only returns the current time. It reads no data and uses only the public key
# that is already in config.js. If it ever fails, GitHub emails the repository owner.
name: Keep the portal database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the keepalive function
        run: |
          URL=$(grep -o "supabaseUrl: *'[^']*" config.js | sed "s/.*'//")
          KEY=$(grep -o "supabaseKey: *'[^']*" config.js | sed "s/.*'//")
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"
          cat out.txt
          test "$code" = "200"
